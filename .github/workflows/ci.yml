name: ci

# The walking skeleton: the pure rules core and the SVG board it paints.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (type-check, then bundle)
        run: npm run build

      - name: Vitest (rules core)
        run: npx vitest run

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Playwright (headless UI tests and screenshots)
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: error

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
