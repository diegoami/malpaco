name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Source-build Help regression
        env:
          HELP_EVIDENCE_DIR: screenshots/source-help
        run: npx playwright test tests/e2e/help.spec.ts --workers=2
      - name: Package the playable build
        run: |
          npm run package:playable
          mkdir -p /tmp/playable && tar -xzf release/malpaco-playable.tar.gz -C /tmp/playable
      - name: Browser tests against the extracted playable
        env:
          PLAYABLE_EXTRACTED_DIR: /tmp/playable
        run: npx playwright test --config playwright.release.config.ts --workers=2
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload playable archive
        uses: actions/upload-artifact@v4
        with:
          name: malpaco-playable
          path: release/malpaco-playable.tar.gz
          retention-days: 14
      - name: Upload browser failure reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
            test-results-release/
            playwright-report-release/
          if-no-files-found: ignore
          retention-days: 14
