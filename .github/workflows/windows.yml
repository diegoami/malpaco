name: windows

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'tools/windows/**'
      - 'tools/release/**'
      - 'src/**'
      - 'public/**'
      - 'docs/play.md'
      - 'docs/manual-images/**'
      - 'tools/manual/**'
      - 'package*.json'
      - 'vite.config.ts'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer-and-portable:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      RUSTUP_TOOLCHAIN: 1.90.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: rustup toolchain install 1.90.0 --profile minimal
      - run: npm ci
      - name: Build exact-source installer and portable executable
        run: npm run windows:build
      - name: Install, launch, resume, reinstall, uninstall and portable smoke
        run: npm run windows:smoke
      - name: Upload original Windows outputs and validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: malpaco-windows
          path: artifacts/windows/
          if-no-files-found: warn
          retention-days: 14
